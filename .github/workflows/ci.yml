name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: false
      - name: Install LintPal
        run: go install github.com/diffpal/lintpal/cmd/lintpal@v0.4.0
      - name: Validate catalog
        run: ./scripts/validate.sh
